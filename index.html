<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PagoMeia Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --roxo:#7c3aed;
  --laranja:#f97316;
  --amarelo:#facc15;
}
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,var(--laranja),var(--amarelo));
  color:#fff;
  display:flex;
  justify-content:center;
}
#app{max-width:900px;width:100%;padding:20px}
.card{
  background:rgba(76,29,149,.85);
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
}
input,button{
  width:100%;padding:12px;border:none;border-radius:10px;margin-bottom:10px
}
button{background:var(--roxo);color:#fff;font-weight:bold}
video{width:100%;border-radius:14px;background:#000}
.hidden{display:none}
</style>
</head>

<body>
<div id="app">

<h1>🎥 PagoMeia Live</h1>

<div id="login" class="card">
  <input id="username" placeholder="Seu nome">
  <button onclick="join()">Entrar</button>
</div>

<div id="roomUI" class="hidden">

<div class="card">
  <video id="video" autoplay playsinline muted></video>

  <label>🔊 Volume</label>
  <input type="range" min="0" max="1" step="0.01"
         onchange="video.volume=this.value">
</div>

<div id="hostUI" class="card hidden">
  <button onclick="startLive()">🎥 Iniciar transmissão</button>
  <button onclick="toggleMic()">🎙️ Ligar / Desligar microfone</button>
  <button onclick="stopLive()">⛔ Encerrar transmissão</button>
</div>

</div>
</div>

<script>
const WS_URL = "https://pagomeia-live.thierrylucazz.workers.dev/";

const params = new URLSearchParams(window.location.search);
const ROOM = params.get("room");
const HOST_KEY = params.get("host"); // só host tem isso

let ws,isHost=false,pc,screenStream,micStream,micSender;

function join(){
  ws = new WebSocket(WS_URL);

  ws.onopen = ()=>{
    ws.send(JSON.stringify({
      type:"join",
      room:ROOM,
      user:username.value,
      hostKey:HOST_KEY || null
    }));

    login.classList.add("hidden");
    roomUI.classList.remove("hidden");
  };

  ws.onmessage = e=>{
    const d = JSON.parse(e.data);

    if(d.type==="host-approved"){
      isHost=true;
      hostUI.classList.remove("hidden");
    }

    if(d.type==="offer"){
      pc=createPC();
      pc.setRemoteDescription(d.offer);
      pc.createAnswer().then(a=>{
        pc.setLocalDescription(a);
        ws.send(JSON.stringify({type:"answer",answer:a}));
      });
    }

    if(d.type==="answer") pc.setRemoteDescription(d.answer);
    if(d.type==="candidate") pc.addIceCandidate(d.candidate);
  };
}

function startLive(){
  if(!isHost) return;

  navigator.mediaDevices.getDisplayMedia({video:true,audio:true}).then(s=>{
    screenStream=s;
    video.srcObject=s;

    pc=createPC();
    s.getTracks().forEach(t=>pc.addTrack(t,s));

    pc.createOffer().then(o=>{
      pc.setLocalDescription(o);
      ws.send(JSON.stringify({type:"offer",offer:o}));
    });
  });
}

  if(!micStream){
    navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
