<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PagoMeia Live</title>
<style>
body{
  background:#1a1a1a;
  color:#fff;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}
#chat{
  width:80%;
  height:200px;
  background:#111;
  border-radius:8px;
  padding:10px;
  overflow:auto;
}
input,button{
  margin:5px;
  padding:8px;
  border-radius:6px;
  border:none;
}
button{ background:#7c3aed;color:#fff }
video{ width:80%; margin-top:10px; border-radius:12px }
</style>
</head>
<body>

<h2>PagoMeia Live</h2>

<input id="name" placeholder="Seu nome">
<input id="pass" placeholder="Senha da sala">
<button id="join">Entrar</button>

<div id="chat"></div>
<input id="msg" placeholder="Mensagem">
<button id="send">Enviar</button>

<video id="video" autoplay></video>

<script>
const ROOM = "PagoMeiaTV";
const WS_URL = "wss://pagomeia-live.thierrylucazz.workers.dev/?room=" + ROOM;

let ws;

document.getElementById("join").onclick = () => {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type:"join",
      username: name.value,
      password: pass.value
    }));
  };

  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if(m.type==="denied") alert("Sala offline ou senha errada");
    if(m.type==="chat") chat.innerHTML += `<div><b>${m.user}:</b> ${m.text}</div>`;
    if(m.type==="user-join") chat.innerHTML += `<div>👤 ${m.user} entrou</div>`;
    if(m.type==="room-ended") {
      alert("Sala encerrada");
      location.reload();
    }
  };
};

send.onclick = () => {
  ws.send(JSON.stringify({type:"chat", text: msg.value}));
  msg.value="";
};
</script>
</body>
</html>
