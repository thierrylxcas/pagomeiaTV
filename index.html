<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PagoMeia Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f0c1a;
  --card:#1a1630;
  --accent:#8b5cf6;
  --accent2:#f59e0b;
  --text:#ffffff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:radial-gradient(circle at top,#1f1b3a,#0f0c1a);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  background:var(--card);
  width:100%;
  max-width:440px;
  padding:24px;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}

h1{
  text-align:center;
  margin-bottom:20px;
  color:var(--accent2);
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
}

.host{background:var(--accent);color:#fff}
.guest{background:#2dd4bf;color:#000}
.danger{background:#ef4444;color:#fff}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:10px;
}

.hidden{display:none}

video{
  width:100%;
  border-radius:14px;
  background:#000;
  margin-top:12px;
}

#chat{
  margin-top:14px;
  height:180px;
  overflow-y:auto;
  background:#0b0820;
  border-radius:10px;
  padding:10px;
  font-size:14px;
}

.msg{margin-bottom:6px}

.controls{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.controls button{flex:1}
</style>
</head>

<body>

<div class="card">

<div id="login">
  <h1>PagoMeia Live</h1>
  <button class="host" onclick="selectRole('host')">Entrar como Host</button>
  <button class="guest" onclick="selectRole('guest')">Entrar como Convidado</button>
  <input id="password" placeholder="Senha">
  <button onclick="enter()">Entrar</button>
</div>

<div id="room" class="hidden">
  <video id="video" autoplay playsinline controls></video>

  <div class="controls" id="hostControls">
    <button class="host" onclick="startStream()">Iniciar Transmissão</button>
    <button class="danger" onclick="endStream()">Encerrar</button>
  </div>

  <div id="chat"></div>

  <div class="controls">
    <input id="msg" placeholder="Mensagem">
    <button onclick="sendMsg()">Enviar</button>
  </div>
</div>

</div>

<script>
const WS_URL = "wss://pagomeia-live.thierrylucazz.workers.dev/";
let role=null, ws=null, pc=null, stream=null;

function selectRole(r){
  role=r;
  alert("Modo: " + (r==="host"?"Host":"Convidado"));
}

function enter(){
  const p=document.getElementById("password").value;
  if(role==="host" && p!=="PagoMeia!123") return alert("Senha host incorreta");
  if(role==="guest" && p!=="convidadopm26") return alert("Senha convidado incorreta");

  login.classList.add("hidden");
  room.classList.remove("hidden");
  if(role!=="host") hostControls.style.display="none";
  connectWS();
}

function connectWS(){
  ws=new WebSocket(WS_URL);
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.type==="chat") addMsg(d.user,d.text);
    if(d.type==="offer" && role==="guest") handleOffer(d.offer);
    if(d.type==="answer" && role==="host") pc.setRemoteDescription(d.answer);
    if(d.type==="ice" && pc) pc.addIceCandidate(d.candidate);
  };
}

function send(data){ ws.send(JSON.stringify(data)); }

function sendMsg(){
  const m=msg.value;
  if(!m) return;
  send({type:"chat",user:role,text:m});
  msg.value="";
}

function addMsg(u,t){
  const d=document.createElement("div");
  d.className="msg";
  d.innerHTML=`<b>${u}:</b> ${t}`;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

async function startStream(){
  stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
  video.srcObject=stream;

  pc=new RTCPeerConnection();
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));

  pc.onicecandidate=e=>{
    if(e.candidate) send({type:"ice",candidate:e.candidate});
  };

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  send({type:"offer",offer});
}

async function handleOffer(offer){
  pc=new RTCPeerConnection();

  pc.ontrack=e=>{ video.srcObject=e.streams[0]; };

  pc.onicecandidate=e=>{
    if(e.candidate) send({type:"ice",candidate:e.candidate});
  };

  await pc.setRemoteDescription(offer);
  const answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);
  send({type:"answer",answer});
}

function endStream(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  location.reload();
}
</script>

</body>
</html>
