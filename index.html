<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PagoMeia Live</title>
<style>
body{
  background:#1a1a1a;
  color:#fff;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}
input,button{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}
button{
  background:#7c3aed;
  color:#fff;
}
#chat{
  width:80%;
  height:200px;
  background:#111;
  border-radius:8px;
  padding:10px;
  overflow:auto;
}
</style>
</head>
<body>

<h2>PagoMeia Live</h2>

<input id="name" placeholder="Seu nome">
<input id="pass" placeholder="Senha da sala">
<button id="join">Entrar</button>

<div id="chat"></div>

<input id="msg" placeholder="Mensagem">
<button id="send">Enviar</button>

<script>
const WS_URL = "wss://pagomeia-live.thierrylucazz.workers.dev/";
let ws;
let allowed = false;

document.getElementById("join").onclick = () => {
  ws = new WebSocket(WS_URL);

  ws.onmessage = e => {
    const m = JSON.parse(e.data);

    if (m.type === "room-open" && !allowed) {
      if (pass.value === m.password) {
        allowed = true;
        ws.send(JSON.stringify({
          type: "user-join",
          user: name.value
        }));
        log("✅ Conectado à sala");
      }
    }

    if (m.type === "room-close") {
      alert("Sala encerrada pelo host");
      location.reload();
    }

    if (m.type === "chat" && allowed) {
      log(`<b>${m.user}:</b> ${m.text}`);
    }

    if (m.type === "user-join") {
      log(`👤 ${m.user} entrou`);
    }
  };
};

document.getElementById("send").onclick = () => {
  if (!allowed) return alert("Sala offline");
  ws.send(JSON.stringify({
    type: "chat",
    user: name.value,
    text: msg.value
  }));
  msg.value = "";
};

function log(msg){
  document.getElementById("chat").innerHTML += `<div>${msg}</div>`;
}
</script>
</body>
</html>
