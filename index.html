<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PagoMeia Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f0c1a;
  --card:#1a1630;
  --accent:#8b5cf6;
  --accent2:#f59e0b;
  --text:#ffffff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:radial-gradient(circle at top,#1f1b3a,#0f0c1a);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  background:var(--card);
  width:100%;
  max-width:420px;
  padding:24px;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}

h1{
  text-align:center;
  margin-bottom:20px;
  color:var(--accent2);
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.host{background:var(--accent);color:#fff}
.guest{background:#2dd4bf;color:#000}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

.hidden{display:none}

#jitsi{
  width:100%;
  height:70vh;
  border-radius:14px;
  overflow:hidden;
}
</style>
</head>

<body>

<div class="card" id="login">
  <h1>PagoMeia Live</h1>
  <button class="host" onclick="selectRole('host')">Entrar como Host</button>
  <button class="guest" onclick="selectRole('guest')">Entrar como Convidado</button>
  <input id="password" placeholder="Senha">
  <button onclick="enter()">Entrar</button>
</div>

<div class="card hidden" id="room">
  <div id="jitsi"></div>
</div>

<script>
let role = null;

function selectRole(r){
  role = r;
  alert("Modo selecionado: " + (r === "host" ? "Host" : "Convidado"));
}

function enter(){
  const pass = document.getElementById("password").value;

  if(role === "host" && pass !== "PagoMeia!123"){
    alert("Senha de host incorreta");
    return;
  }

  if(role === "guest" && pass !== "convidadopm26"){
    alert("Senha de convidado incorreta");
    return;
  }

  document.getElementById("login").classList.add("hidden");
  document.getElementById("room").classList.remove("hidden");

  loadJitsi();
}

function loadJitsi(){
  const script = document.createElement("script");
  script.src = "https://meet.jit.si/external_api.js";
  script.onload = () => {
    const domain = "meet.jit.si";
    const options = {
      roomName: "PagoMeiaTV",
      parentNode: document.getElementById("jitsi"),
      width: "100%",
      height: "100%",
      userInfo: {
        displayName: role === "host" ? "PagoMeia Host" : "Convidado"
      },
      configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        prejoinPageEnabled: false
      },
      interfaceConfigOverwrite: {
        SHOW_JITSI_WATERMARK: false,
        SHOW_WATERMARK_FOR_GUESTS: false
      }
    };

    const api = new JitsiMeetExternalAPI(domain, options);

    if(role === "host"){
      api.executeCommand("toggleShareScreen");
    }
  };
  document.body.appendChild(script);
}
</script>

</body>
</html>
