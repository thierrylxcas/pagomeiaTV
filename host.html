<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PagoMeia Live – HOST</title>
<style>
body{
  background:#121212;
  color:#fff;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}
button{
  background:#7c3aed;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
  margin:6px;
  font-size:16px;
}
#chat{
  width:80%;
  height:200px;
  background:#1a1a1a;
  border-radius:8px;
  padding:10px;
  overflow:auto;
}
</style>
</head>
<body>

<h1>PagoMeia Live – HOST</h1>

<button id="enter">Criar Sala</button>
<button id="end" hidden>🛑 Encerrar Sala</button>

<div id="chat"></div>

<script>
const WS_URL = "wss://pagomeia-live.thierrylucazz.workers.dev/";
let ws;
let roomPassword = "";
let heartbeat;

document.getElementById("enter").onclick = () => {
  const hostPass = prompt("Senha do host:");
  if (hostPass !== "PagoMeia!123") {
    alert("Senha inválida");
    return;
  }

  roomPassword = prompt("Crie a senha da sala:");
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    sendRoomOpen();
    heartbeat = setInterval(sendRoomOpen, 2000);
    log("🔴 Sala aberta");
    document.getElementById("end").hidden = false;
  };

  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "chat") {
      log(`<b>${m.user}:</b> ${m.text}`);
    }
    if (m.type === "user-join") {
      log(`👤 ${m.user} entrou`);
    }
  };
};

function sendRoomOpen(){
  ws.send(JSON.stringify({
    type: "room-open",
    password: roomPassword
  }));
}

document.getElementById("end").onclick = () => {
  clearInterval(heartbeat);
  ws.send(JSON.stringify({ type: "room-close" }));
  ws.close();
  location.reload();
};

function log(msg){
  document.getElementById("chat").innerHTML += `<div>${msg}</div>`;
}
</script>
</body>
</html>
